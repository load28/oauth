[package]
name = "bitcoin-predictor"
version = "0.1.0"
edition = "2021"
authors = ["Bitcoin Predictor Team"]
description = "Bitcoin price prediction using quantitative analysis and news sentiment"

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Statistics and math
statrs = "0.17"

# Environment variables
dotenvy = "0.15"

[[bin]]
name = "bitcoin-predictor"
path = "src/main.rs"
