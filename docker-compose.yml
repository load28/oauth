version: '3.8'

services:
  oauth-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oauth-server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Database configuration
      DATABASE_URL: ${DATABASE_URL:-sqlite:/app/data/oauth.db}

      # JWT configuration
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER:-oauth-server}

      # Server configuration
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}

      # CORS configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Token expiration configuration
      TOKEN_ACCESS_TOKEN_EXPIRATION_SECONDS: ${TOKEN_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}
      TOKEN_REFRESH_TOKEN_EXPIRATION_SECONDS: ${TOKEN_REFRESH_TOKEN_EXPIRATION_SECONDS:-2592000}
      TOKEN_AUTHORIZATION_CODE_EXPIRATION_SECONDS: ${TOKEN_AUTHORIZATION_CODE_EXPIRATION_SECONDS:-600}

      # Logging
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Persist SQLite database
      - oauth-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -f /app/oauth-server"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - oauth-network

volumes:
  oauth-data:
    driver: local

networks:
  oauth-network:
    driver: bridge
